# shelf configuration (sample for the TOML parser benchmark)
# Everything below is test data, not a schema decision.

title = "My Library"          # free text
locale = 'en_US'

[grouping]
# thresholds for work grouping (F-GRP-6)
auto_merge = 0.9              # at or above: merged automatically
review = 0.5                  # between review and auto_merge: ask the user
max_hamming = 10              # SimHash distance limit
stop_words = ["the", "a", "an", "of", "and", "der", "die", "das"]

[grouping.normalization]
strip_edition = true
strip_series = true
patterns = [
  "\\(.*?\\)",            # parenthesized suffixes
  "\\[.*?\\]",            # bracketed suffixes
]

[search]
limit = 20
snippet_chars = 160
fuzzy = { enabled = true, max_edits = 2 }

[mcp]
readOnly = true
port = 8765
host = "127.0.0.1"
started = 2026-10-14T08:30:00+02:00

[[library]]
name = "ebooks"
root = "/Users/ada/Ebooks"

[[library]]
name = "papers"
root = "/Users/ada/Papers"

[logging]
level = "info"
file = ""
rotate_bytes = 1_048_576
