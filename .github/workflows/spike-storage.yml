name: spike-storage

# Temporary, non-required: four-platform functional check of the storage spike (ADR 0004).
# Not part of the `ci` aggregate job in build.yml. Remove when M0 closes.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'experiments/storage/**'
      - '.github/workflows/spike-storage.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
            arch: x86_64
          - rid: osx-arm64
            os: macos-15
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Assert runner architecture
        env:
          EXPECTED_ARCH: ${{ matrix.arch }}
          RUNNER_LABEL: ${{ matrix.os }}
        run: |
          actual="$(uname -m)"
          echo "uname -m: $actual (expected $EXPECTED_ARCH)"
          if [ "$actual" != "$EXPECTED_ARCH" ]; then
            echo "::error::Runner label '$RUNNER_LABEL' delivered '$actual', expected '$EXPECTED_ARCH'"
            exit 1
          fi
      - name: Install AOT prerequisites (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Storage spike check
        run: ./experiments/storage/check.sh "${{ matrix.rid }}"
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-check-${{ matrix.rid }}
          path: experiments/storage/results/ci/
          if-no-files-found: warn
